name: Release tag for Webstore

on:
  repository_dispatch:
    types: [release_tag]

jobs:
  release:
    name: Auto Increment Release Tag with Timestamp
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Fetch the latest tag and generate a new tag with a timestamp
      - name: Get the latest tag and generate new tag with timestamp
        id: generate_tag
        run: |
          # GitHub API token for authentication
          GITHUB_TOKEN=${{ secrets.PAT }}

          # Get the current timestamp in the desired format (e.g., YYYY-MM-DD_HHMM)
          timestamp=$(date +"%Y-%m-%d_%H%M")

          # Fetch the latest tag from the repository
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/MRRSoft/znode-webstore10x-page-builder/tags")

          # Debug: Print raw response to see structure
          echo "Raw API Response: $response"

          # Process the valid JSON response and extract the latest tag
          if echo "$response" | jq empty > /dev/null 2>&1; then
            latest_tag=$(echo "$response" | jq -r '.[].name' | sort -V | tail -n 1)

            if [ -z "$latest_tag" ]; then
              echo "No valid tags found, starting from Znode10-lt-${timestamp}"
              latest_tag="Znode10-lt-${timestamp}"
            fi
          else
            echo "Error: Invalid response from GitHub API"
            exit 1
          fi

          echo "Latest tag: $latest_tag"

          # Construct the new tag with the timestamp
          new_tag="Znode10-lt-${timestamp}"
          new_release_name="Release-${new_tag}"
          echo "New tag: $new_tag"
          echo "New release name: $new_release_name"

          # Set the new tag and release name as environment variables
          echo "tag_name=$new_tag" >> $GITHUB_ENV
          echo "release_name=$new_release_name" >> $GITHUB_ENV

      # Create a new release with the generated tag and timestamp
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          tag_name: ${{ env.tag_name }}
          release_name: ${{ env.release_name }}
          body: |
            Release ${{ env.release_name }} created with tag ${{ env.tag_name }}.
          draft: false
          prerelease: true
